name: Update deals

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch deals
        env:
          AWIN_FEED_1: ${{ secrets.AWIN_FEED_1 }}
          AWIN_FEED_2: ${{ secrets.AWIN_FEED_2 }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch_deals.py

      - name: Save changes
        id: save
        run: |
          git config user.name "rigdeals-bot"
          git config user.email "rigdeals-bot@users.noreply.github.com"
          git add deals.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update deals"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect site files
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: |
          mkdir _site
          cp index.html deals.json _site/
          cp feed.xml _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        with:
          path: _site

      - id: deploy
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
